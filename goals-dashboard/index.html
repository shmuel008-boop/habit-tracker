<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המסלול שלי</title><style>:root{--cream:#fff6ea;--ink:#563d32;--rose:#ed8b72;--terracotta:#cc6550;--gold:#f5bd56;--sage:#6ea58c;--card:#fffdf9;--line:#f0d9c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#ffe6ca,transparent 40%),var(--cream);color:var(--ink);font:15px Arial,sans-serif}.app{max-width:560px;margin:auto;padding:22px 14px 70px}header{text-align:center;padding:18px 0 15px}header small{color:var(--terracotta);font-weight:bold;letter-spacing:1px}h1{font-size:32px;margin:8px 0 5px}header p{margin:0;color:#876e60}.sync{color:var(--sage);font-size:12px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.panel,.goal{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px #a0613c18}.stat{text-align:center;padding:13px 6px}.stat b{display:block;font-size:23px;color:var(--terracotta)}.stat span{font-size:11px;color:#8c7163}.tabs{display:flex;gap:8px;margin:18px 0 12px}.tab{flex:1;border:1px solid var(--line);background:#ffeadd;color:#8a5142;border-radius:13px;padding:12px;font-weight:bold}.tab.active{background:linear-gradient(135deg,var(--terracotta),var(--rose));color:#fff;border-color:transparent}.panel{padding:16px}.view{display:none}.view.active{display:block}h2{font-size:17px;margin:0 0 14px}.row{display:flex;gap:8px}input,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fffaf5;color:var(--ink)}textarea{height:82px;resize:vertical}button{font:inherit;font-weight:bold;border:0;border-radius:11px;padding:10px 13px;background:var(--terracotta);color:#fff;cursor:pointer}.goal{padding:13px;margin-top:11px;background:linear-gradient(135deg,#fffdf9,#fff5ec)}.goalTop{display:flex;align-items:center;gap:9px}.goalTop b{flex:1}.delete{background:#fde3dc;color:#a54b38;padding:7px 9px}.progress{height:7px;border-radius:8px;background:#f5e4d4;margin:11px 0 7px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:inherit}.days{display:flex;gap:4px;direction:ltr;margin-top:10px}.days button{flex:1;padding:8px 0;background:#f9e9dc;color:#986e5d;font-size:10px}.days button.on{background:var(--sage);color:#fff}.chart{height:130px;display:flex;align-items:end;gap:5px;padding:12px 3px 0;border-bottom:2px solid #f1d7bd}.chart i{flex:1;min-height:4px;background:linear-gradient(180deg,var(--gold),var(--rose));border-radius:8px 8px 0 0}.tip{background:#fff0d8;border-radius:12px;padding:10px;color:#835f42;font-size:12px;margin-top:13px}.note{border-top:1px dashed var(--line);padding:13px 0;line-height:1.45}.note small{color:#967562}.empty{color:#a38877;text-align:center;padding:24px 5px}</style><main class="app"><header><small>דשבורד צמיחה אישי</small><h1>המסלול שלי</h1><p id="date"></p><div class="sync" id="sync">טוען סנכרון…</div></header><section class="stats" id="stats"></section><nav class="tabs"><button class="tab active" data-tab="goals">🎯 מטרות</button><button class="tab" data-tab="notes">✨ תובנות</button></nav><section id="goals" class="view active"><div class="panel"><h2>המטרות שלי</h2><form class="row" id="goalForm"><input id="goalInput" placeholder="למשל: לקרוא 20 דקות" required><button>הוספה</button></form><div id="goalList"></div></div><div class="panel" style="margin-top:14px"><h2>עקביות בשבועיים האחרונים</h2><div class="chart" id="chart"></div><div class="tip">כל עמודה מראה כמה מהמטרות סומנו באותו יום.</div></div></section><section id="notes" class="view"><div class="panel"><h2>מה למדתי היום</h2><form id="noteForm"><textarea id="noteInput" placeholder="רעיון, תובנה או משהו חדש שלמדת…" required></textarea><div class="row" style="margin-top:8px"><input id="sourceInput" placeholder="מקור (אופציונלי)"><button>שמירה</button></div></form><div id="noteList"></div></div></section></main><script>const U='https://script.google.com/macros/s/AKfycbzETjNu8h8Vo23sNWQIbEMS_T3yVuc9y_h4wbYG5OlVf-NI9Ud82r5ipAjXLuwsej1F/exec',q=x=>document.getElementById(x),days=n=>Array.from({length:n},(_,i)=>{let d=new Date();d.setDate(d.getDate()-n+1+i);return d.toISOString().slice(0,10)}),today=()=>days(1)[0];let s={goals:[],notes:[]};const esc=x=>{let d=document.createElement('i');d.textContent=x;return d.innerHTML};function save(){localStorage.goalsWarm=JSON.stringify(s);fetch(U,{method:'POST',mode:'no-cors',body:JSON.stringify(s)});q('sync').textContent='☁ נשמר ומסונכרן'}async function load(){try{let x=await fetch(U+'?t='+Date.now()).then(r=>r.json());if(x.state)s={goals:x.state.goals||[],notes:x.state.notes||[]};q('sync').textContent='☁ מסונכרן בענן'}catch{try{s=JSON.parse(localStorage.goalsWarm)||s}catch{}q('sync').textContent='נשמר במכשיר'}draw()}function draw(){q('date').textContent=new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());let total=s.goals.length,done=s.goals.filter(g=>g.done?.[today()]).length;q('stats').innerHTML=[['מטרות',total],['הושלמו היום',done+'/'+total],['קצב היום',total?Math.round(done/total*100)+'%':'0%']].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');q('goalList').innerHTML=s.goals.length?s.goals.map(g=>{let n=days(30).filter(d=>g.done?.[d]).length;return '<article class="goal"><div class="goalTop"><b>'+esc(g.title)+'</b><button class="delete" data-del="'+g.id+'">הסרה</button></div><div class="progress"><i style="width:'+Math.round(n/30*100)+'%"></i></div><small>'+n+' ימים מתוך 30</small><div class="days">'+days(7).map(d=>'<button data-goal="'+g.id+'" data-day="'+d+'" class="'+(g.done?.[d]?'on':'')+'">'+d.slice(8)+'</button>').join('')+'</div></article>'}).join(''):'<div class="empty">הוסיפי את המטרה הראשונה שלך כדי להתחיל.</div>';q('chart').innerHTML=days(14).map(d=>{let p=total?s.goals.filter(g=>g.done?.[d]).length/total*100:0;return '<i title="'+d+'" style="height:'+p+'%"></i>'}).join('');q('noteList').innerHTML=s.notes.length?s.notes.slice().reverse().map(n=>'<div class="note">'+esc(n.t)+'<br><small>'+esc(n.src||'תובנה אישית')+' · '+n.d+'</small></div>').join(''):'<div class="empty">כאן יישמרו הדברים שלמדת במהלך היום.</div>'}q('goalList').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.del){s.goals=s.goals.filter(g=>String(g.id)!==b.dataset.del)}else if(b.dataset.goal){let g=s.goals.find(g=>String(g.id)===b.dataset.goal);g.done??={};g.done[b.dataset.day]?delete g.done[b.dataset.day]:g.done[b.dataset.day]=1}else return;save();draw()};q('goalForm').onsubmit=e=>{e.preventDefault();s.goals.push({id:Date.now(),title:q('goalInput').value.trim(),done:{}});q('goalInput').value='';save();draw()};q('noteForm').onsubmit=e=>{e.preventDefault();s.notes.push({t:q('noteInput').value.trim(),src:q('sourceInput').value.trim(),d:today()});q('noteInput').value=q('sourceInput').value='';save();draw()};document.querySelector('.tabs').onclick=e=>{let b=e.target.closest('button');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))};load()</script>
