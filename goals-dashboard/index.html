<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המסלול שלי</title><style>body{margin:0;background:#101015;color:#eee;font:15px Arial}.app{max-width:520px;margin:auto;padding:18px}h1{margin:8px 0}p,small{color:#91919f}.box,.goal{background:#1b1b25;border:1px solid #30303d;border-radius:14px;padding:14px;margin-top:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stats div{text-align:center;background:#222230;border-radius:10px;padding:11px}.stats b{display:block;font-size:22px;color:#74e9bb}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #373747;border-radius:8px;background:#262633;color:#fff;font:inherit}textarea{height:75px}button{padding:10px;border:0;border-radius:8px;background:#8070f7;color:#fff;font-weight:bold;cursor:pointer}.row{display:flex;gap:7px}.row input{flex:1}.goal h3{margin:0;flex:1}.days{display:flex;gap:4px;margin-top:10px;direction:ltr}.days button{flex:1;padding:7px 0;background:#292936;color:#aaa;font-size:10px}.days .on{background:#1e513e;color:#74e9bb}.bar{height:6px;background:#292936;border-radius:5px;margin:10px 0}.bar i{display:block;height:100%;background:#74e9bb;border-radius:5px}.note{border-top:1px solid #30303d;padding:10px 0}.del{background:transparent;color:#ff8888}.chart{height:90px;display:flex;align-items:end;gap:4px}.chart i{flex:1;background:#8070f7;min-height:3px;border-radius:4px 4px 0 0}</style><main class="app"><small id="sync">טוען…</small><h1>המסלול שלי</h1><p id="date"></p><section class="stats" id="stats"></section><section class="box"><b>המטרות שלי</b><form class="row" id="gf" style="margin-top:10px"><input id="gt" placeholder="מטרה חדשה" required><button>הוספה</button></form><div id="goals"></div></section><section class="box"><b>עקביות ב־14 הימים האחרונים</b><div class="chart" id="chart"></div></section><section class="box"><b>מה למדתי היום</b><form id="nf" style="margin-top:10px"><textarea id="nt" placeholder="רעיון או תובנה…" required></textarea><div class="row"><input id="ns" placeholder="מקור (אופציונלי)"><button>שמירה</button></div></form><div id="notes"></div></section></main><script>const U='https://script.google.com/macros/s/AKfycbzETjNu8h8Vo23sNWQIbEMS_T3yVuc9y_h4wbYG5OlVf-NI9Ud82r5ipAjXLuwsej1F/exec',q=id=>document.getElementById(id),ds=n=>Array.from({length:n},(_,i)=>{let d=new Date();d.setDate(d.getDate()-n+1+i);return d.toISOString().slice(0,10)}),td=()=>ds(1)[0];let s={goals:[],notes:[]};function e(x){let d=document.createElement('i');d.textContent=x;return d.innerHTML}function save(){localStorage.x=JSON.stringify(s);fetch(U,{method:'POST',mode:'no-cors',body:JSON.stringify(s)});q('sync').textContent='☁ נשמר בענן'}async function load(){try{let x=await fetch(U+'?x='+Date.now()).then(r=>r.json());if(x.state)s=x.state;q('sync').textContent='☁ מסונכרן'}catch{try{s=JSON.parse(localStorage.x)}catch{}q('sync').textContent='שמירה מקומית'}draw()}function tog(id,d){let g=s.goals.find(x=>x.id==id);g.done??={};g.done[d]?delete g.done[d]:g.done[d]=1;save();draw()}function draw(){q('date').textContent=new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'}).format(new Date());let n=s.goals.length,a=s.goals.filter(g=>g.done?.[td()]).length;q('stats').innerHTML=[['מטרות',n],['היום',a+'/'+n],['עמידה',n?Math.round(a/n*100):0+'%']].map(x=>'<div><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('');q('goals').innerHTML=s.goals.map(g=>{let c=ds(30).filter(d=>g.done?.[d]).length;return '<article class="goal"><div class="row"><h3>'+e(g.title)+'</h3><button class="del" onclick="del(''+g.id+'')">✕</button></div><div class="bar"><i style="width:'+c/30*100+'%"></i></div><small>'+c+' ימים מתוך 30</small><div class="days">'+ds(7).map(d=>'<button class="'+(g.done?.[d]?'on':'')+'" onclick="tog(''+g.id+'',''+d+'')">'+d.slice(8)+'</button>').join('')+'</div></article>'}).join('')||'<p>הוסיפי מטרה ראשונה.</p>';q('chart').innerHTML=ds(14).map(d=>{let x=n?s.goals.filter(g=>g.done?.[d]).length/n*100:0;return '<i style="height:'+x+'%"></i>'}).join('');q('notes').innerHTML=s.notes.slice().reverse().map(x=>'<div class="note">'+e(x.t)+'<br><small>'+e(x.src||'תובנה אישית')+' · '+x.d+'</small></div>').join('')}function del(id){s.goals=s.goals.filter(g=>g.id!=id);save();draw()}q('gf').onsubmit=x=>{x.preventDefault();s.goals.push({id:Date.now(),title:q('gt').value,done:{}});q('gt').value='';save();draw()};q('nf').onsubmit=x=>{x.preventDefault();s.notes.push({t:q('nt').value,src:q('ns').value,d:td()});q('nt').value=q('ns').value='';save();draw()};load()</script>
