<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a23;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #7c6ff7;
    --accent2: #f7a26f;
    --accent3: #6ff7b8;
    --text: #e8e8f0;
    --muted: #888899;
    --danger: #f76f6f;
    --done-bg: #1e3a2e;
    --done-border: #3dba7a;
    --done-text: #6ff7b8;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Rubik', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── BACKGROUND NOISE ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 16px 12px 100px; }

  /* ── HEADER ── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header-title span { color: var(--accent); }
  .header-date { font-size: 12px; color: var(--muted); text-align: left; line-height: 1.4; }

  /* ── MONTH NAV ── */
  .month-nav {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .month-name { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
  .nav-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); width: 34px; height: 34px; border-radius: 50%;
    cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s;
  }
  .nav-btn:active { transform: scale(0.92); background: var(--accent); }

  /* ── STATS STRIP ── */
  .stats-strip {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 10px; text-align: center;
  }
  .stat-val { font-size: 22px; font-weight: 800; line-height: 1; }
  .stat-val.green { color: var(--accent3); }
  .stat-val.purple { color: var(--accent); }
  .stat-val.orange { color: var(--accent2); }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* ── SECTION TITLE ── */
  .section-title {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin: 20px 0 10px;
  }

  /* ── HABIT CARDS ── */
  .habit-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px;
    overflow: hidden; transition: border-color 0.2s;
  }
  .habit-card.has-today { border-color: var(--done-border); }

  .habit-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; cursor: pointer;
    user-select: none;
  }
  .habit-emoji { font-size: 20px; width: 28px; text-align: center; }
  .habit-name { flex: 1; font-size: 14px; font-weight: 500; }
  .habit-pct {
    font-size: 13px; font-weight: 700;
    min-width: 38px; text-align: center;
  }
  .habit-pct.high { color: var(--accent3); }
  .habit-pct.mid { color: var(--accent2); }
  .habit-pct.low { color: var(--danger); }

  .today-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--surface2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.15s; flex-shrink: 0;
  }
  .today-btn.done {
    background: var(--done-bg); border-color: var(--done-border);
    color: var(--done-text);
  }
  .today-btn:active { transform: scale(0.88); }

  /* ── CALENDAR GRID ── */
  .calendar-wrap { padding: 0 14px 14px; display: none; }
  .habit-card.open .calendar-wrap { display: block; }

  .cal-days-header {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 3px; margin-bottom: 4px;
  }
  .cal-day-label {
    text-align: center; font-size: 9px; color: var(--muted);
    font-weight: 600; text-transform: uppercase;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-cell {
    aspect-ratio: 1; border-radius: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted); cursor: pointer;
    transition: all 0.12s; position: relative; font-weight: 500;
  }
  .cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .cal-cell.done {
    background: var(--done-bg); border-color: var(--done-border);
    color: var(--done-text); font-weight: 700;
  }
  .cal-cell.today { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cal-cell:not(.empty):active { transform: scale(0.88); }
  .cal-cell.done::after {
    content: '✓'; position: absolute; top: 1px; right: 2px;
    font-size: 7px; color: var(--done-border);
  }

  /* Progress bar under grid */
  .habit-progress-bar {
    height: 4px; border-radius: 2px;
    background: var(--border); margin-top: 10px; overflow: hidden;
  }
  .habit-progress-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    transition: width 0.4s ease;
  }

  /* ── BOTTOM NAV TABS ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; z-index: 100;
  }
  .nav-tab {
    flex: 1; padding: 12px 0; text-align: center; cursor: pointer;
    font-size: 10px; color: var(--muted); transition: color 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .nav-tab .tab-icon { font-size: 20px; }
  .nav-tab.active { color: var(--accent); }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── SETTINGS ── */
  .settings-section { margin-bottom: 24px; }
  .settings-label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
  }

  .habit-setting-row {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .emoji-picker-btn {
    font-size: 22px; cursor: pointer; width: 36px; text-align: center;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px;
  }
  .habit-name-input {
    flex: 1; background: transparent; border: none;
    color: var(--text); font-family: 'Rubik', sans-serif;
    font-size: 14px; outline: none;
  }
  .habit-name-input::placeholder { color: var(--muted); }
  .del-btn {
    background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 4px;
    transition: color 0.2s;
  }
  .del-btn:active { color: var(--danger); }

  .add-habit-btn {
    width: 100%; padding: 14px; border-radius: var(--radius);
    background: var(--surface); border: 2px dashed var(--border);
    color: var(--accent); font-family: 'Rubik', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; margin-bottom: 16px;
  }
  .add-habit-btn:active { background: var(--surface2); border-color: var(--accent); }

  .save-btn {
    width: 100%; padding: 16px; border-radius: var(--radius);
    background: var(--accent); border: none;
    color: #fff; font-family: 'Rubik', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .save-btn:active { opacity: 0.85; transform: scale(0.98); }

  /* ── YEARLY VIEW ── */
  .year-habit-row { margin-bottom: 16px; }
  .year-habit-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .year-months-grid {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px;
  }
  .year-month-cell {
    aspect-ratio: 1; border-radius: 5px; display: flex;
    align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; color: transparent;
    transition: all 0.3s;
  }
  .year-month-label {
    font-size: 8px; color: var(--muted); text-align: center;
    margin-top: 4px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px;
  }
  .year-month-label span { text-align: center; }

  /* ── EMOJI MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 200; display: none; align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .emoji-modal {
    background: var(--surface2); border-radius: 20px 20px 0 0;
    padding: 20px; width: 100%; max-height: 50vh; overflow-y: auto;
  }
  .emoji-grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px;
  }
  .emoji-opt {
    font-size: 24px; text-align: center; padding: 6px;
    cursor: pointer; border-radius: 8px; transition: background 0.1s;
  }
  .emoji-opt:active { background: var(--border); }

  .archive-row {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
    opacity: 0.75;
  }
  .archive-name { flex: 1; font-size: 13px; color: var(--muted); }
  .archive-stats { font-size: 11px; color: var(--muted); text-align: left; line-height: 1.5; }
  .restore-btn {
    background: var(--surface2); border: 1px solid var(--accent);
    color: var(--accent); font-family: 'Rubik', sans-serif;
    font-size: 12px; font-weight: 600; padding: 6px 10px;
    border-radius: var(--radius-sm); cursor: pointer;
  }
  .restore-btn:active { background: var(--accent); color: #fff; }
  .archive-history {
    display: none; padding: 10px 14px 14px;
    border-top: 1px solid var(--border);
  }
  .archive-row-wrap.open .archive-history { display: block; }
  .archive-mini-grid {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-bottom: 6px;
  }
  .archive-mini-cell {
    aspect-ratio: 1; border-radius: 4px;
  }
  .archive-month-labels {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px;
  }
  .archive-month-labels span { font-size: 7px; color: var(--muted); text-align: center; }
  .no-archive { font-size: 12px; color: var(--muted); text-align: center; padding: 12px 0; }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent3); color: #0f1a14;
    padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 700;
    opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 300; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── STREAK BADGE ── */
  .streak-badge {
    font-size: 10px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 100px;
    padding: 2px 8px; color: var(--accent2); font-weight: 600;
  }
</style>
</head>
<body>

<div id="app">

  <!-- ══════════ TRACKER VIEW ══════════ -->
  <div class="view active" id="view-tracker">
    <div class="header">
      <div>
        <div class="header-title">Habit <span>Tracker</span></div>
      </div>
      <div class="header-date" id="header-date"></div>
    </div>

    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-name" id="month-display"></div>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>

    <div class="stats-strip">
      <div class="stat-card">
        <div class="stat-val purple" id="stat-today">0%</div>
        <div class="stat-label">היום</div>
      </div>
      <div class="stat-card">
        <div class="stat-val green" id="stat-month">0%</div>
        <div class="stat-label">חודש</div>
      </div>
      <div class="stat-card">
        <div class="stat-val orange" id="stat-streak">0 🔥</div>
        <div class="stat-label">רצף</div>
      </div>
    </div>

    <div class="section-title">הרגלים</div>
    <div id="habits-list"></div>
  </div>

  <!-- ══════════ YEARLY VIEW ══════════ -->
  <div class="view" id="view-year">
    <div class="header">
      <div class="header-title">סקירה <span>שנתית</span></div>
      <div class="header-date" id="year-display"></div>
    </div>
    <div id="year-grid"></div>
  </div>

  <!-- ══════════ SETTINGS VIEW ══════════ -->
  <div class="view" id="view-settings">
    <div class="header">
      <div class="header-title">הגדרות <span>הרגלים</span></div>
    </div>
    <div class="settings-section">
      <div class="settings-label">הרגלים שלי</div>
      <div id="settings-habits-list"></div>
      <button class="add-habit-btn" onclick="addHabit()">+ הוסף הרגל חדש</button>
      <button class="save-btn" onclick="saveHabits()">💾 שמור שינויים</button>
    </div>
    <div class="settings-section" style="margin-top:24px" id="archive-section">
      <div class="settings-label">ארכיון הרגלים שנמחקו</div>
      <div id="archive-list"></div>
    </div>

    <div class="settings-section" style="margin-top:24px">
      <div class="settings-label">נתונים</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px">
        <div style="font-size:13px;color:var(--muted);margin-bottom:12px">כל הנתונים נשמרים בדפדפן שלך</div>
        <button onclick="loadFromSheets().then(ok=>{if(ok){state.currentYear=new Date().getFullYear();state.currentMonth=new Date().getMonth();renderTracker();showToast('☁️ סונכרן בהצלחה!');}else{showToast('⚠️ לא נמצאו נתונים')}})" style="width:100%;padding:11px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--accent);color:var(--accent);font-family:'Rubik',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px">☁️ טען מהענן (Google Sheets)</button>
        <button onclick="exportData()" style="width:100%;padding:11px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Rubik',sans-serif;font-size:13px;cursor:pointer;margin-bottom:8px">📤 ייצא נתונים (JSON)</button>
        <button onclick="if(confirm('למחוק את כל הנתונים?')){clearData()}" style="width:100%;padding:11px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid #f76f6f44;color:var(--danger);font-family:'Rubik',sans-serif;font-size:13px;cursor:pointer">🗑️ מחק הכל</button>
      </div>
    </div>
  </div>

</div>

<!-- ── BOTTOM NAV ── -->
<div class="bottom-nav">
  <div class="nav-tab active" onclick="switchView('tracker')" id="tab-tracker">
    <div class="tab-icon">✅</div>
    <div>מעקב</div>
  </div>
  <div class="nav-tab" onclick="switchView('year')" id="tab-year">
    <div class="tab-icon">📊</div>
    <div>שנה</div>
  </div>
  <div class="nav-tab" onclick="switchView('settings')" id="tab-settings">
    <div class="tab-icon">⚙️</div>
    <div>הגדרות</div>
  </div>
</div>

<!-- ── EMOJI MODAL ── -->
<div class="modal-overlay" id="emoji-modal" onclick="closeEmojiModal(event)">
  <div class="emoji-modal">
    <div style="font-size:13px;font-weight:600;margin-bottom:14px;color:var(--muted)">בחר אייקון</div>
    <div class="emoji-grid" id="emoji-grid"></div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
const EMOJIS = ['💪','🏃','📚','🧘','💧','🥗','😴','✍️','🎯','🎸','🚴','🧹','💊','🐕','🌿','☀️','🧠','❤️','🔥','⭐','🎨','💻','🗣️','🙏','🍎','🌊','🏋️','📝','🎵','🤸'];

const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DAYS_HE   = ['א','ב','ג','ד','ה','ו','ש'];
const DAY_ORDER = [0,1,2,3,4,5,6]; // Sun=0..Sat=6

let state = {
  habits: [
    {id:1, name:'קום מוקדם', emoji:'☀️'},
    {id:2, name:'ספורט', emoji:'💪'},
    {id:3, name:'קריאה 30 דק', emoji:'📚'},
    {id:4, name:'שתיית מים', emoji:'💧'},
    {id:5, name:'מדיטציה', emoji:'🧘'},
    {id:6, name:'אוכל בריא', emoji:'🥗'},
    {id:7, name:'שינה עד 23:00', emoji:'😴'},
    {id:8, name:'עבודה על יעד', emoji:'🎯'},
  ],
  done: {},  // key: "habitId_YYYY-MM-DD" => true
  currentYear: new Date().getFullYear(),
  currentMonth: new Date().getMonth(), // 0-based
};

let emojiTarget = null; // {habitId or settingIdx}

const SHEETS_URL = "https://script.google.com/macros/s/AKfycbyxkrAwKDL7MiH5c4TU5MpRqlyKhzbHLS76CXV735bzUW1O5-H7f0bujOzhvv2MiM1n/exec";

function saveState() {
  localStorage.setItem('ht_state', JSON.stringify(state));
  fetch(SHEETS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(state)
  }).catch(()=>{});
}

function loadState() {
  const s = localStorage.getItem('ht_state');
  if (s) { try { state = {...state, ...JSON.parse(s)}; } catch(e){} }
}

async function loadFromSheets() {
  try {
    const res = await fetch(SHEETS_URL + '?t=' + Date.now());
    const data = await res.json();
    if (data.state) {
      state = {...state, ...data.state};
      localStorage.setItem('ht_state', JSON.stringify(state));
      return true;
    }
  } catch(e) {}
  return false;
}

// ════════════════════════════════════════════════
// DATES
// ════════════════════════════════════════════════
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateKey(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function doneKey(hid, dateStr) { return `${hid}_${dateStr}`; }
function isDone(hid, dateStr) { return !!state.done[doneKey(hid, dateStr)]; }

function daysInMonth(y,m) { return new Date(y,m+1,0).getDate(); }
// getDay(): 0=Sun...6=Sat. We want grid: Sun=col0
function firstDayOfMonth(y,m) { return new Date(y,m,1).getDay(); }

// ════════════════════════════════════════════════
// STATS
// ════════════════════════════════════════════════
function calcStats() {
  const t = today();
  const habits = state.habits;
  if (!habits.length) return {todayPct:0, monthPct:0, streak:0};

  // Today %
  const doneToday = habits.filter(h => isDone(h.id, t)).length;
  const todayPct = Math.round(doneToday / habits.length * 100);

  // Month %
  const y = state.currentYear, m = state.currentMonth;
  const days = daysInMonth(y, m);
  let total = 0, possible = 0;
  for (let d = 1; d <= days; d++) {
    const dk = dateKey(y,m,d);
    const dayDate = new Date(y, m, d);
    if (dayDate > new Date()) break;
    for (const h of habits) { if (isDone(h.id, dk)) total++; }
    possible += habits.length;
  }
  const monthPct = possible ? Math.round(total/possible*100) : 0;

  // Streak: consecutive days where ALL habits done
  let streak = 0;
  const now = new Date(); now.setHours(0,0,0,0);
  for (let i = 0; i < 365; i++) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const dk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const allDone = habits.every(h => isDone(h.id, dk));
    if (allDone) streak++;
    else if (i > 0) break;
  }

  return {todayPct, monthPct, streak};
}

function habitMonthPct(hid) {
  const y = state.currentYear, m = state.currentMonth;
  const days = daysInMonth(y,m);
  let done = 0, total = 0;
  const now = new Date();
  for (let d = 1; d <= days; d++) {
    const dd = new Date(y,m,d);
    if (dd > now) break;
    total++;
    if (isDone(hid, dateKey(y,m,d))) done++;
  }
  return total ? Math.round(done/total*100) : 0;
}

// ════════════════════════════════════════════════
// RENDER TRACKER
// ════════════════════════════════════════════════
function renderTracker() {
  // Header date
  const now = new Date();
  const days_full = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  document.getElementById('header-date').innerHTML =
    `יום ${days_full[now.getDay()]}<br>${now.getDate()} ${MONTHS_HE[now.getMonth()]} ${now.getFullYear()}`;

  // Month nav
  document.getElementById('month-display').textContent =
    `${MONTHS_HE[state.currentMonth]} ${state.currentYear}`;

  // Stats
  const {todayPct, monthPct, streak} = calcStats();
  document.getElementById('stat-today').textContent = `${todayPct}%`;
  document.getElementById('stat-month').textContent = `${monthPct}%`;
  document.getElementById('stat-streak').textContent = `${streak} 🔥`;

  // Habits
  const container = document.getElementById('habits-list');
  container.innerHTML = '';
  const t = today();
  const y = state.currentYear, m = state.currentMonth;

  state.habits.forEach(h => {
    const doneToday = isDone(h.id, t);
    const pct = habitMonthPct(h.id);
    const pctClass = pct >= 70 ? 'high' : pct >= 40 ? 'mid' : 'low';

    // Build calendar
    const days = daysInMonth(y,m);
    const firstDay = firstDayOfMonth(y,m); // 0=Sun
    const cells = [];
    // empty cells
    for (let i = 0; i < firstDay; i++) cells.push({empty: true});
    const now2 = new Date(); now2.setHours(23,59,59,999);
    for (let d = 1; d <= days; d++) {
      const dk = dateKey(y,m,d);
      const isToday = dk === t;
      const future = new Date(y,m,d) > now2;
      cells.push({day:d, dk, isToday, future, done: isDone(h.id, dk)});
    }

    const calCells = cells.map(c => {
      if (c.empty) return `<div class="cal-cell empty"></div>`;
      const cls = [
        'cal-cell',
        c.done ? 'done' : '',
        c.isToday ? 'today' : '',
        c.future ? 'future' : ''
      ].filter(Boolean).join(' ');
      return `<div class="${cls}" onclick="toggleDay(${h.id},'${c.dk}')">${c.day}</div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = `habit-card${doneToday ? ' has-today' : ''}`;
    card.id = `card-${h.id}`;
    card.innerHTML = `
      <div class="habit-header" onclick="toggleCard(${h.id})">
        <div class="habit-emoji">${h.emoji}</div>
        <div class="habit-name">${h.name}</div>
        <div class="habit-pct ${pctClass}">${pct}%</div>
        <button class="today-btn ${doneToday ? 'done' : ''}" onclick="event.stopPropagation();toggleDay(${h.id},'${t}')">
          ${doneToday ? '✓' : '○'}
        </button>
      </div>
      <div class="calendar-wrap">
        <div class="cal-days-header">
          <div class="cal-day-label">א</div><div class="cal-day-label">ב</div>
          <div class="cal-day-label">ג</div><div class="cal-day-label">ד</div>
          <div class="cal-day-label">ה</div><div class="cal-day-label">ו</div>
          <div class="cal-day-label">ש</div>
        </div>
        <div class="cal-grid">${calCells}</div>
        <div class="habit-progress-bar">
          <div class="habit-progress-fill" style="width:${pct}%"></div>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function toggleCard(hid) {
  const card = document.getElementById(`card-${hid}`);
  card.classList.toggle('open');
}

function toggleDay(hid, dk) {
  const key = doneKey(hid, dk);
  if (state.done[key]) delete state.done[key];
  else { state.done[key] = true; showToast('✓ סומן!'); }
  saveState();
  renderTracker();
}

function changeMonth(dir) {
  state.currentMonth += dir;
  if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
  if (state.currentMonth < 0)  { state.currentMonth = 11; state.currentYear--; }
  renderTracker();
}

// ════════════════════════════════════════════════
// RENDER YEARLY
// ════════════════════════════════════════════════
function renderYear() {
  const y = state.currentYear;
  document.getElementById('year-display').textContent = y;
  const container = document.getElementById('year-grid');
  container.innerHTML = '';

  // Month labels
  const labelsRow = document.createElement('div');
  labelsRow.className = 'year-month-label';
  MONTHS_HE.forEach(mn => {
    const s = document.createElement('span');
    s.textContent = mn.substring(0,3);
    labelsRow.appendChild(s);
  });
  container.appendChild(labelsRow);

  state.habits.forEach(h => {
    const row = document.createElement('div');
    row.className = 'year-habit-row';

    const nameDiv = document.createElement('div');
    nameDiv.className = 'year-habit-name';
    nameDiv.innerHTML = `<span>${h.emoji}</span><span>${h.name}</span>`;

    const grid = document.createElement('div');
    grid.className = 'year-months-grid';

    for (let m = 0; m < 12; m++) {
      const days = daysInMonth(y, m);
      let done = 0, total = 0;
      const now = new Date(); now.setHours(23,59,59,999);
      for (let d = 1; d <= days; d++) {
        const dd = new Date(y,m,d);
        if (dd > now) break;
        total++;
        if (isDone(h.id, dateKey(y,m,d))) done++;
      }
      const pct = total ? done/total : 0;
      const cell = document.createElement('div');
      cell.className = 'year-month-cell';
      // Color based on pct
      if (total === 0) {
        cell.style.background = 'var(--surface2)';
        cell.style.border = '1px solid var(--border)';
      } else {
        const r = Math.round(111 + (47-111)*pct);
        const g = Math.round(111 + (247-111)*pct);
        const b = Math.round(111 + (106-111)*pct);
        cell.style.background = `rgb(${r},${g},${b})`;
        cell.style.opacity = 0.3 + pct*0.7;
      }
      cell.title = `${MONTHS_HE[m]}: ${Math.round(pct*100)}%`;
      grid.appendChild(cell);
    }

    row.appendChild(nameDiv);
    row.appendChild(grid);
    container.appendChild(row);
  });
}

// ════════════════════════════════════════════════
// SETTINGS
// ════════════════════════════════════════════════
function renderSettings() {
  const container = document.getElementById('settings-habits-list');
  container.innerHTML = '';
  state.habits.forEach((h, idx) => {
    const row = document.createElement('div');
    row.className = 'habit-setting-row';
    row.innerHTML = `
      <div class="emoji-picker-btn" onclick="openEmojiModal(${idx})">${h.emoji}</div>
      <input class="habit-name-input" type="text" value="${h.name}"
        id="input-${h.id}" placeholder="שם הרגל..." maxlength="30">
      <button class="del-btn" onclick="deleteHabit(${h.id})">✕</button>`;
    container.appendChild(row);
  });
}

function addHabit() {
  const newId = Date.now();
  state.habits.push({id: newId, name: '', emoji: '⭐'});
  renderSettings();
  setTimeout(() => {
    const inp = document.getElementById(`input-${newId}`);
    if (inp) inp.focus();
  }, 50);
}

function deleteHabit(hid) {
  if (state.habits.length <= 1) { showToast('חייב לפחות הרגל אחד'); return; }
  // Archive the habit definition so its historical done-data is preserved
  if (!state.archived) state.archived = {};
  const habit = state.habits.find(h => h.id === hid);
  if (habit) state.archived[hid] = habit;
  // Remove from active list only — done keys (hid_date) remain untouched in state.done
  state.habits = state.habits.filter(h => h.id !== hid);
  renderSettings();
}

function saveHabits() {
  state.habits.forEach(h => {
    const inp = document.getElementById(`input-${h.id}`);
    if (inp) h.name = inp.value.trim() || h.name;
  });
  state.habits = state.habits.filter(h => h.name);
  saveState();
  showToast('✓ נשמר בהצלחה!');
  renderTracker();
}

// ════════════════════════════════════════════════
// EMOJI MODAL
// ════════════════════════════════════════════════
function openEmojiModal(idx) {
  emojiTarget = idx;
  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = EMOJIS.map(e =>
    `<div class="emoji-opt" onclick="selectEmoji('${e}')">${e}</div>`
  ).join('');
  document.getElementById('emoji-modal').classList.add('open');
}

function selectEmoji(e) {
  if (emojiTarget !== null) {
    state.habits[emojiTarget].emoji = e;
    renderSettings();
  }
  closeEmojiModal();
}

function closeEmojiModal(e) {
  if (!e || e.target === document.getElementById('emoji-modal'))
    document.getElementById('emoji-modal').classList.remove('open');
}

// ════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`view-${name}`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'year') renderYear();
  if (name === 'settings') { renderSettings(); renderArchive(); }
  if (name === 'tracker') renderTracker();
}

// ════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function renderArchive() {
  const container = document.getElementById('archive-list');
  const archived = state.archived || {};
  const keys = Object.keys(archived);
  if (!keys.length) {
    container.innerHTML = '<div class="no-archive">אין הרגלים בארכיון</div>';
    return;
  }
  container.innerHTML = '';
  keys.forEach(hid => {
    const h = archived[hid];
    const id = parseInt(hid);

    // Calc total done across all time
    const doneDates = Object.keys(state.done)
      .filter(k => k.startsWith(`${hid}_`));
    const totalDone = doneDates.length;

    // Per-year stats (last 2 years)
    const years = [...new Set(doneDates.map(k => k.split('_')[1].substring(0,4)))].sort();

    const wrap = document.createElement('div');
    wrap.className = 'archive-row-wrap';

    // Build yearly heat map for current year
    const y = new Date().getFullYear();
    const monthCells = Array.from({length:12}, (_,m) => {
      const days = daysInMonth(y,m);
      let done = 0, total = 0;
      const now = new Date(); now.setHours(23,59,59,999);
      for (let d = 1; d <= days; d++) {
        const dd = new Date(y,m,d);
        if (dd > now) break;
        total++;
        if (isDone(id, dateKey(y,m,d))) done++;
      }
      const pct = total ? done/total : 0;
      return {pct, total};
    });

    const cellsHTML = monthCells.map(({pct, total}) => {
      if (!total) return `<div class="archive-mini-cell" style="background:var(--surface2);border:1px solid var(--border)"></div>`;
      const g = Math.round(50 + pct*150);
      return `<div class="archive-mini-cell" style="background:rgba(111,247,184,${0.2+pct*0.8})"></div>`;
    }).join('');

    const labelsHTML = MONTHS_HE.map(mn =>
      `<span>${mn.substring(0,3)}</span>`).join('');

    wrap.innerHTML = `
      <div class="archive-row" onclick="wrap.classList.toggle('open')" style="cursor:pointer">
        <div class="habit-emoji">${h.emoji}</div>
        <div class="archive-name">${h.name}</div>
        <div class="archive-stats">${totalDone} ימים ✓<br>${years.join(', ') || '—'}</div>
        <button class="restore-btn" onclick="event.stopPropagation();restoreHabit(${id})">שחזר</button>
      </div>
      <div class="archive-history">
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${y} — ביצועים חודשיים</div>
        <div class="archive-mini-grid">${cellsHTML}</div>
        <div class="archive-month-labels">${labelsHTML}</div>
      </div>`;

    // need to attach toggle manually since wrap isn't in DOM yet
    wrap.querySelector('.archive-row').addEventListener('click', () => wrap.classList.toggle('open'));
    container.appendChild(wrap);
  });
}

function restoreHabit(hid) {
  const archived = state.archived || {};
  const h = archived[hid];
  if (!h) return;
  // Avoid duplicate
  if (state.habits.find(x => x.id === hid)) { showToast('כבר קיים ברשימה'); return; }
  state.habits.push(h);
  delete archived[hid];
  state.archived = archived;
  saveState();
  renderSettings();
  showToast(`✓ ${h.name} שוחזר!`);
}


function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `habits_${today()}.json`;
  a.click();
}

function clearData() {
  localStorage.removeItem('ht_state');
  location.reload();
}

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
async function init() {
  loadState(); // load from localStorage first (fast)
  state.currentYear  = new Date().getFullYear();
  state.currentMonth = new Date().getMonth();
  renderTracker();
  // Then try to load fresher data from Sheets
  const loaded = await loadFromSheets();
  if (loaded) {
    state.currentYear  = new Date().getFullYear();
    state.currentMonth = new Date().getMonth();
    renderTracker();
    showToast('☁️ סונכרן מהענן!');
  }
}
init();
</script>
